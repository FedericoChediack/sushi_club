<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SushiGift · SushiClub</title>
  <meta name="theme-color" content="#0e0d0c">
  <link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/gift.css">
  <script defer src="../js/shared/data.js"></script>
  <script defer src="../js/shared/store.js"></script>
  <script defer src="../js/shared/utils.js"></script>
  <script defer src="../js/shared/validaciones.js"></script>
  <script defer src="../js/shared/components.js"></script>
  <script defer src="../js/shared/modals.js"></script>
  <script defer src="../js/shared/layout.js"></script>
  <script defer src="../js/gift.js"></script>
</head>
<body>
  <main id="principal">
    <section class="banda">
      <div class="contenedor regalo-cabecera">
        <div class="regalo-cabecera__texto">
          <span class="antetitulo antetitulo--suave">REGALOS DE SUSHI</span>
          <h1 class="titulo-pantalla">SushiGift</h1>
        </div>
        <div class="imagen imagen--tarjeta regalo-cabecera__imagen"><img src="../img/gift/sushigift.jpg" alt="Caja SushiGift con cinta roja"></div>
      </div>
    </section>

    <div id="regalo-flujo">
      <div class="pasos-linea"><div class="contenedor" id="regalo-pasos"></div></div>
      <div class="contenedor dos-columnas">
        <form class="dos-columnas__principal regalo-principal" id="regalo-form" novalidate>
          <div class="regalo-paso" id="regalo-paso"></div>
          <div class="regalo-nav">
            <button type="button" class="boton boton--borde regalo-nav__atras" data-accion="atras">← Atrás</button>
            <button type="submit" class="boton regalo-nav__siguiente" id="regalo-siguiente">Siguiente →</button>
          </div>
        </form>
        <aside class="dos-columnas__lateral panel regalo-panel" id="regalo-panel" aria-label="Tu regalo"></aside>
      </div>
    </div>

    <section class="contenedor exito regalo-enviado" id="regalo-enviado" hidden tabindex="-1" aria-labelledby="regalo-enviado-titulo">
      <div class="exito__tilde" aria-hidden="true">✓</div>
      <h2 class="regalo-enviado__titulo" id="regalo-enviado-titulo">Tu regalo está en camino</h2>
      <p class="regalo-enviado__cuando" id="regalo-enviado-cuando"></p>
      <p class="regalo-enviado__texto">Te avisamos por email cuando salga y cuando llegue. Podés seguirlo desde Mis pedidos.</p>
      <div class="exito__acciones">
        <a class="boton" href="pedidos.html">Ver Mis pedidos</a>
        <a class="boton boton--borde" href="../index.html">Volver al inicio</a>
      </div>
    </section>
  </main>
</body>
</html>
