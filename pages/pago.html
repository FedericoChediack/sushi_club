<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pago · SushiClub</title>
  <meta name="theme-color" content="#0e0d0c">
  <link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/pago.css">
  <script type="module" src="../js/pago.js"></script>
</head>
<body>
  <main id="principal">
    <div class="contenedor dos-columnas">
      <form class="dos-columnas__principal pago-form" id="pago-form" novalidate aria-labelledby="titulo-pago">
        <h1 class="titulo-pantalla titulo-pantalla--filete" id="titulo-pago">Pago</h1>

        <section class="pago-paso" aria-labelledby="pago-paso-1">
          <div class="pago-paso__cabecera"><span class="pago-paso__numero">01</span><h2 class="pago-paso__titulo" id="pago-paso-1">Tus datos</h2></div>
          <div id="pago-datos"></div>
        </section>

        <section class="pago-paso" aria-labelledby="pago-paso-2">
          <div class="pago-paso__cabecera"><span class="pago-paso__numero">02</span><h2 class="pago-paso__titulo" id="pago-paso-2">Entrega</h2></div>
          <div id="pago-entrega"></div>
        </section>

        <section class="pago-paso" aria-labelledby="pago-paso-3">
          <div class="pago-paso__cabecera"><span class="pago-paso__numero">03</span><h2 class="pago-paso__titulo" id="pago-paso-3">Medio de pago</h2></div>
          <div id="pago-medio"></div>
        </section>
      </form>

      <aside class="dos-columnas__lateral panel pago-panel" id="pago-panel" aria-label="Resumen del pedido"></aside>
    </div>
  </main>
</body>
</html>
